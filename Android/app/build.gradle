plugins { id 'com.android.application' }
android {
    namespace 'com.xcosmos.minivoice'
    compileSdk 35
    sourceSets.main.assets.srcDirs = ['../../.build/work/shared-ui']
    def sharedUI = tasks.register('buildSharedPlayer', Exec) {
        workingDir rootProject.projectDir.parentFile
        commandLine 'bash', 'Scripts/build/build-shared-ui.sh'
    }
    tasks.configureEach { task -> if (task.name == 'preBuild') task.dependsOn(sharedUI) }
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path file('../../Shared/Core/CMakeLists.txt'); version '3.22.1' } }
    defaultConfig { applicationId 'com.xcosmos.minivoice'; minSdk 29; targetSdk 34; versionCode 1; versionName '1.0.0'; externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' } }
    def configuredKey = System.getenv('MINIVOICE_KEYSTORE')
    def localKey = configuredKey ? file(configuredKey) : rootProject.file('signing/debug.keystore')
    def fingerprintFile = rootProject.file('signing-certificate.sha256')
    signingConfigs {
        debug {
            storeFile localKey
            storePassword System.getenv('MINIVOICE_STORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('MINIVOICE_KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('MINIVOICE_KEY_PASSWORD') ?: (System.getenv('MINIVOICE_STORE_PASSWORD') ?: 'android')
        }
    }
    def verifyIdentity = tasks.register('verifyMiniVoiceSigning') {
        doLast {
            if (!localKey.isFile() || !fingerprintFile.isFile()) {
                throw new GradleException('缺少统一签名，请先运行 Scripts/tools/import-android-signing.sh 导入旧 Mac 原始密钥。')
            }
            def config = signingConfigs.debug
            def store = java.security.KeyStore.getInstance(localKey, config.storePassword.toCharArray())
            if (!store.isKeyEntry(config.keyAlias)) throw new GradleException('签名文件中没有对应私钥。')
            def cert = store.getCertificate(config.keyAlias)
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(cert.encoded).encodeHex().toString()
            if (actual != fingerprintFile.text.trim()) throw new GradleException('签名证书与项目固定指纹不一致，拒绝打包。')
        }
    }
    tasks.configureEach { task ->
        if (task.name == 'preBuild') task.dependsOn(verifyIdentity)
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
